<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pocket Pilot — Kinetic + In sync</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/ui/app.scoped.css" />
    <link rel="stylesheet" href="assets/lib/kit.css" />
    <script src="assets/ui/fragments.js"></script>
    <script src="assets/lib/kit.js"></script>
    <style>
      @font-face { font-family: 'Inter'; src: url('assets/fonts/InterVariable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: block; }
      #root { background: #06070b; }
      #el-bg, #el-hook, #el-sync, #el-features, #el-setup, #el-close { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- D: B's kinetic type with C's typing demo and set-up, on one 120 BPM grid. Plan: STORYBOARD.md -->
    <div id="root" data-composition-id="kinetic-sync" data-start="0" data-width="1920" data-height="1080" data-duration="60" data-fps="30">
      <div id="el-bg" data-composition-id="ks-bg" data-composition-src="compositions/kinetic-sync/bg.html" data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-hook" data-composition-id="ks-hook" data-composition-src="compositions/kinetic-sync/hook.html" data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-sync" data-composition-id="ks-sync" data-composition-src="compositions/kinetic-sync/sync.html" data-start="10" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-features" data-composition-id="ks-features" data-composition-src="compositions/kinetic-sync/features.html" data-start="20" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-setup" data-composition-id="ks-setup" data-composition-src="compositions/kinetic-sync/setup.html" data-start="36" data-duration="14" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-close" data-composition-id="ks-close" data-composition-src="compositions/kinetic-sync/close.html" data-start="50" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="ks-music" src="assets/audio/kinetic-sync.wav" data-start="0" data-duration="60" data-track-index="13" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines['kinetic-sync'] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
