<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- A Home Screen test for WebKit bug 301994: the app's manifest and viewport, without the apple-* meta tags. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="theme-color" content="#21252b" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex" />
  <title>Screen test</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../../app/icons/apple-touch-icon.png" />
  <link rel="icon" href="../../app/icons/icon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #282c34; color: #d7dae0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-text-size-adjust: 100%; }
    .shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
    header { flex: none; padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px; background: #21252b; border-bottom: 1px solid #181a1f; font-weight: 700; font-size: 18px; color: #fff; }
    main { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; }
    .verdict { padding: 14px 16px; border-radius: 12px; font-weight: 650; font-size: 17px; }
    .verdict.ok { background: rgba(152, 195, 121, 0.16); color: #b5e08f; border: 1px solid rgba(152, 195, 121, 0.45); }
    .verdict.bad { background: rgba(224, 108, 117, 0.16); color: #ff9aa2; border: 1px solid rgba(224, 108, 117, 0.45); }
    .verdict.wait { background: rgba(229, 192, 123, 0.14); color: #f0cf8e; border: 1px solid rgba(229, 192, 123, 0.4); }
    table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: 15px; }
    td { padding: 7px 0; border-bottom: 1px solid #353b45; }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: #fff; }
    p { color: #9da5b4; font-size: 15px; }
    footer { flex: none; padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 14px); background: #4f78ff; color: #fff; font-weight: 650; text-align: center; }
  </style>
  <script src="./test.js" defer></script>
</head>
<body>
  <div class="shell">
    <header>Pocket Pilot · screen test</header>
    <main>
      <div class="verdict wait" id="verdict">Measuring…</div>
      <table id="facts"></table>
      <p id="note"></p>
    </main>
    <footer>This blue bar is the bottom of the page</footer>
  </div>
</body>
</html>
