<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Visor phone — tilted: the phone is the robot (visor on screen, antenna), in a jeans pocket with golden stitching</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#6366f1" stop-opacity=".55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#c3cfdf"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3558d6"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="-6" stdDeviation="7" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g transform="rotate(-9 256 330)">
    <path d="M292 68L312 34" stroke="#c3cfdf" stroke-width="8" stroke-linecap="round"/>
    <circle cx="315" cy="28" r="11" fill="#f472b6"/>
    <rect x="164" y="66" width="184" height="340" rx="42" fill="url(#metal)"/>
    <rect x="177" y="81" width="158" height="310" rx="30" fill="#0b1224"/>
    <rect x="236" y="93" width="40" height="11" rx="5.5" fill="#1e293b"/>
    <rect x="188" y="144" width="136" height="72" rx="36" fill="url(#visor)"/>
    <path d="M206 161Q236 151 270 155" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="228" cy="183" r="17" fill="#fff" opacity=".25"/>
